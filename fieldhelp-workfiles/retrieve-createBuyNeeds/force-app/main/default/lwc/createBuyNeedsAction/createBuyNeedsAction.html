<template>
	<lightning-quick-action-panel header="Buy Needs 登録">
		<lightning-record-edit-form
			object-api-name="Buy_Needs__c"
			onsuccess={handleSuccess}
		>
			<lightning-input-field field-name="Name"></lightning-input-field>
			<lightning-input-field
				field-name="NeedsType__c"
				onchange={handle_needs_type_change}
			></lightning-input-field>
			<!-- その他のフィールド -->
			<div class="slds-modal__footer">
				<lightning-button
					variant="neutral"
					label="キャンセル"
					onclick={handle_cancel}
				></lightning-button>
				<lightning-button
					variant="brand"
					type="submit"
					label="保存"
				></lightning-button>
			</div>
		</lightning-record-edit-form>
	</lightning-quick-action-panel>
</template>
